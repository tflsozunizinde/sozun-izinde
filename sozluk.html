<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kadim Sözlük | Dîvânu Lugâti't-Türk</title>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --color-gold: #c9a84c;
      --color-gold-light: #e8d8b0;
      --color-bg-dark: #0f0c08;
      --color-surface: rgba(26, 20, 13, 0.85);
      --border-gold: rgba(201, 168, 76, 0.25);
    }
    body {
      background-color: var(--color-bg-dark);
      color: #f0e6d2;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding-bottom: 60px;
    }
    .header-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(15, 12, 8, 0.95);
      border-bottom: 1px solid var(--border-gold);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .brand-link {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--color-gold);
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.15rem;
      transition: all 0.3s ease;
    }
    .brand-link:hover {
      color: #ffd700;
      transform: scale(1.02);
    }
    .nav-btn-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(201, 168, 76, 0.12);
      border: 1px solid var(--border-gold);
      color: var(--color-gold-light);
      padding: 6px 14px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .nav-btn-home:hover {
      background: var(--color-gold);
      color: #120a02;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    .hero-title {
      font-family: 'Cinzel', serif;
      text-align: center;
      font-size: 2.4rem;
      color: var(--color-gold);
      margin-bottom: 0.5rem;
    }
    .hero-desc {
      text-align: center;
      color: #bfa882;
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
    .search-box-wrap {
      max-width: 650px;
      margin: 0 auto 2rem;
      position: relative;
    }
    .search-input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 20px;
      font-size: 1.05rem;
      border-radius: 30px;
      border: 1.5px solid var(--color-gold);
      background: rgba(20, 15, 10, 0.9);
      color: #fff;
      outline: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .search-input:focus {
      border-color: #ffd700;
      box-shadow: 0 0 15px rgba(201, 168, 76, 0.4);
    }
    .category-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 2.5rem;
    }
    .pill-btn {
      background: rgba(25, 20, 14, 0.7);
      border: 1px solid var(--border-gold);
      color: #d4c29d;
      padding: 7px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.25s ease;
    }
    .pill-btn.active, .pill-btn:hover {
      background: var(--color-gold);
      color: #120a02;
      border-color: #ffd700;
    }
    .words-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .word-card {
      background: var(--color-surface);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s ease;
      position: relative;
    }
    .word-card:hover {
      transform: translateY(-4px);
      border-color: var(--color-gold);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 0 12px rgba(201, 168, 76, 0.2);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.8rem;
      border-bottom: 1px solid rgba(201, 168, 76, 0.15);
      padding-bottom: 0.5rem;
    }
    .card-word {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      color: var(--color-gold);
      font-weight: 700;
    }
    .card-category {
      font-size: 0.75rem;
      color: #a89470;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card-modern {
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 0.6rem;
    }
    .card-desc {
      font-size: 0.9rem;
      color: #c4b598;
      line-height: 1.5;
      margin-bottom: 1rem;
    }
    .card-example {
      font-size: 0.82rem;
      color: #a89470;
      font-style: italic;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 12px;
      border-radius: 6px;
      border-left: 2px solid var(--color-gold);
    }
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: #bfa882;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- ÜST MENÜ VE ANA SAYFAYA DÖNÜŞ BAĞLANTISI -->
  <header class="header-nav">
    <a href="index.html" class="brand-link" title="Ana Sayfaya Dön">
      <span>🏛️</span>
      <span>Dîvânu Lugâti't-Türk</span>
    </a>
    <a href="index.html" class="nav-btn-home">
      <span>🏠 Ana Sayfaya Dön</span>
    </a>
  </header>

  <main class="container">
    <h1 class="hero-title">100 Kadim Kelime Sözlüğü</h1>
    <p class="hero-desc">Kaşgarlı Mahmud'un bin yıl önce kaydettiği Türkçe kelime hazinesi</p>

    <!-- AKILLI ARAMA ÇUBUĞU -->
    <div class="search-box-wrap">
      <input type="text" id="search-input" class="search-input" placeholder="Kelime, günümüz karşılığı veya anlam ara (Örn: bilig, akıl, alp)...">
    </div>

    <!-- KATEGORİ SEÇİCİLER -->
    <div class="category-pills" id="category-pills">
      <button class="pill-btn active" data-cat="all">Tümü (100)</button>
    </div>

    <!-- KELİME KARTLARI LİSTESİ -->
    <div class="words-grid" id="words-grid"></div>
  </main>

  <script src="words.js"></script>
  <script src="music-player.js"></script>
  <script>
    // TÜRKÇE KARAKTER VE AKILLI ARAMA NORMALİZASYONU
    function normalizeTR(str) {
      if (!str) return '';
      return str.toString()
        .toLowerCase()
        .replace(/ğ/g, 'g')
        .replace(/ü/g, 'u')
        .replace(/ş/g, 's')
        .replace(/ı/g, 'i')
        .replace(/ö/g, 'o')
        .replace(/ç/g, 'c')
        .replace(/[\.\,\-\'\"]/g, '')
        .trim();
    }

    const searchInput = document.getElementById('search-input');
    const categoryContainer = document.getElementById('category-pills');
    const wordsGrid = document.getElementById('words-grid');

    let currentCategory = 'all';
    const wordsList = typeof WORDS_DATA !== 'undefined' ? WORDS_DATA : [];

    // Kategorileri Dinamik Çıkar
    const categories = ['all'];
    wordsList.forEach(w => {
      if (w.category && !categories.includes(w.category)) {
        categories.push(w.category);
      }
    });

    // Kategori Butonlarını Oluştur
    categoryContainer.innerHTML = categories.map(cat => `
      <button class="pill-btn ${cat === 'all' ? 'active' : ''}" data-cat="${cat}">
        ${cat === 'all' ? 'Tümü (' + wordsList.length + ')' : cat}
      </button>
    `).join('');

    // Kartları Ekrana Bas
    function renderWords(list) {
      if (!list || list.length === 0) {
        wordsGrid.innerHTML = `
          <div class="no-results">
            <p>Aradığınız kriterlere uygun kelime bulunamadı.</p>
          </div>
        `;
        return;
      }

      wordsGrid.innerHTML = list.map(item => `
        <div class="word-card">
          <div>
            <div class="card-header">
              <span class="card-word">${item.word}</span>
              <span class="card-category">${item.category || ''}</span>
            </div>
            <div class="card-modern">${item.meaning || item.modern || ''}</div>
            <div class="card-desc">${item.desc || item.description || ''}</div>
          </div>
          ${item.example ? `<div class="card-example">"${item.example}"</div>` : ''}
        </div>
      `).join('');
    }
