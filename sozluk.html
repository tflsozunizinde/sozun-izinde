<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kadim Kelimeler Sözlüğü – Dîvânu Lugâti't-Türk | Dilimizin Zenginlikleri</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,400&family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
/* Sözlük Özel Stilleri */
:root {
  --color-gold: #c9a84c;
  --color-gold-light: #e8d8b0;
  --color-gold-dark: #8a6d2b;
  --color-cream: #f5eedb;
  --color-bg-dark: #0f0c08;
  --color-bg-card: rgba(28, 20, 12, 0.88);
  --color-border: rgba(201, 168, 76, 0.28);
  --radius-card: 14px;
  --radius-pill: 50px;
  --shadow-gold: 0 4px 24px rgba(201, 168, 76, 0.18);
}

.sozluk-header {
  padding: 4.5rem 1.5rem 2.5rem;
  text-align: center;
  position: relative;
  background: radial-gradient(ellipse at 50% 20%, rgba(201,168,76,0.14) 0%, transparent 70%);
}
.sozluk-header h1 {
  font-family: 'Cinzel', serif;
  font-size: clamp(2rem, 5vw, 3.2rem);
  color: var(--color-gold);
  letter-spacing: .04em;
  margin-bottom: .6rem;
  text-shadow: 0 2px 20px rgba(201,168,76,0.35);
}
.sozluk-header p {
  color: var(--color-gold-light);
  font-size: 1.05rem;
  max-width: 620px;
  margin: 0 auto 1.5rem;
  opacity: .88;
}
.word-count-badge {
  font-size: .82rem;
  font-weight: 600;
  color: var(--color-gold-light);
  background: rgba(201,168,76,0.12);
  border: 1px solid rgba(201,168,76,0.25);
  border-radius: var(--radius-pill);
  padding: .4em 1em;
  white-space: nowrap;
}

/* Arama ve Filtre Çubuğu */
.controls-wrap {
  max-width: 1100px;
  margin: 0 auto 2.5rem;
  padding: 0 1.2rem;
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
}
.search-row {
  display: flex;
  gap: .8rem;
  align-items: center;
}
.search-input-wrap {
  position: relative;
  flex: 1;
}
.search-input-wrap input {
  width: 100%;
  box-sizing: border-box;
  background: var(--color-bg-card);
  border: 1.5px solid var(--color-border);
  color: #fff;
  border-radius: var(--radius-pill);
  padding: .85rem 1.2rem .85rem 3rem;
  font-size: 1rem;
  outline: none;
  transition: all .3s ease;
}
.search-input-wrap input:focus {
  border-color: var(--color-gold);
  box-shadow: 0 0 16px rgba(201,168,76,0.35);
}
.search-icon {
  position: absolute;
  left: 1.1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-gold);
  font-size: 1.1rem;
  pointer-events: none;
}

/* Kategori Butonları */
.cat-scroll-wrap {
  display: flex;
  gap: .5rem;
  overflow-x: auto;
  padding-bottom: .4rem;
  scrollbar-width: thin;
}
.cat-btn {
  background: rgba(28,20,12,0.7);
  border: 1px solid var(--color-border);
  color: var(--color-gold-light);
  padding: .5rem 1.1rem;
  border-radius: var(--radius-pill);
  font-size: .84rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all .25s ease;
}
.cat-btn:hover, .cat-btn.active {
  background: var(--color-gold);
  color: #120a02;
  border-color: #ffd700;
  font-weight: 700;
}

/* Kelime Kartları Izgarası */
.words-grid {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 1.2rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 1.5rem;
}
.word-card {
  background: var(--color-bg-card);
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: 1.6rem;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  backdrop-filter: blur(10px);
  transition: all .3s cubic-bezier(.4,0,.2,1);
  position: relative;
}
.word-card:hover {
  transform: translateY(-4px);
  border-color: var(--color-gold);
  box-shadow: 0 8px 30px rgba(0,0,0,0.6), var(--shadow-gold);
}
.word-card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: .8rem;
  border-bottom: 1px solid rgba(201,168,76,0.18);
  padding-bottom: .6rem;
}
.word-title {
  font-family: 'Cinzel', serif;
  font-size: 1.45rem;
  font-weight: 700;
  color: var(--color-gold);
}
.word-cat-badge {
  font-size: .72rem;
  text-transform: uppercase;
  color: var(--color-gold-light);
  background: rgba(201,168,76,0.12);
  border-radius: var(--radius-pill);
  padding: .25em .8em;
}
.word-modern {
  font-size: 1.1rem;
  font-weight: 600;
  color: #fff;
  margin-bottom: .5rem;
}
.word-desc {
  font-size: .92rem;
  color: #d4c29d;
  line-height: 1.55;
  margin-bottom: 1rem;
}
.word-example {
  background: rgba(0,0,0,0.35);
  border-left: 3px solid var(--color-gold);
  padding: .6rem .8rem;
  border-radius: 4px;
  font-size: .85rem;
  color: #e0d2b4;
  font-style: italic;
}
.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 4rem 1rem;
  color: var(--color-gold-light);
}
  </style>
</head>
<body>

  <!-- Üst Navigasyon Menüsü -->
  <header class="site-header" id="site-header">
    <nav class="navbar" role="navigation" aria-label="Ana Navigasyon">
      <a href="index.html" class="brand" id="brand-logo" style="display:flex;align-items:center;gap:12px;text-decoration:none">
        <div class="tfl-badge-wrap" style="position:relative;display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#c9a84c 0%,#7d611d 100%);padding:2px;box-shadow:0 0 15px rgba(201,168,76,0.45);transition:all 0.3s ease">
          <img src="assets/tfl_logo.jpeg" alt="TFL Logosu" style="width:100%;height:100%;border-radius:10px;object-fit:cover;display:block" />
        </div>
        <div style="display:flex;flex-direction:column;line-height:1.2">
          <span class="brand-text" style="font-weight:700;letter-spacing:0.02em">Dilimizin Zenginlikleri</span>
          <span style="font-size:0.7rem;color:var(--color-gold);font-weight:600;letter-spacing:0.08em;text-transform:uppercase">TFL · Dîvânu Lugâti't-Türk</span>
        </div>
      </a>
      <ul class="nav-links" id="nav-links" role="menubar">
        <li role="none"><a href="index.html" class="nav-link" role="menuitem">Ana Sayfa</a></li>
        <li role="none"><a href="divanu.html" class="nav-link" role="menuitem">Dîvânu Lugâti't-Türk</a></li>
        <li role="none"><a href="sozluk.html" class="nav-link active" role="menuitem">Sözlük</a></li>
        <li role="none"><a href="harita.html" class="nav-map-btn" role="menuitem">🗺️ Canlı Harita</a></li>
      </ul>
    </nav>
  </header>

  <!-- Başlık -->
  <section class="sozluk-header">
    <h1>Kadim Kelimeler Sözlüğü</h1>
    <p>Kaşgarlı Mahmud'un bin yıl önce Dîvânu Lugâti't-Türk'te derlediği eşsiz kelime hazinesi</p>
    <span class="word-count-badge" id="word-count">100 Kelime</span>
  </section>

  <!-- Filtreler ve Arama -->
  <div class="controls-wrap">
    <div class="search-row">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Kelime veya anlam ara (Örn: bilig, akıl, alp)..." />
      </div>
    </div>
    <div class="cat-scroll-wrap" id="cat-filters">
      <button class="cat-btn active" data-cat="all">Tümü (100)</button>
    </div>
  </div>

  <!-- Kelimeler Izgarası -->
  <main class="words-grid" id="words-grid"></main>

  <script src="words.js"></script>
  <script src="music-player.js"></script>
  <script>
    const searchInput = document.getElementById('search-input');
    const catContainer = document.getElementById('cat-filters');
    const wordsGrid = document.getElementById('words-grid');
    const wordCountBadge = document.getElementById('word-count');

    let activeCat = 'all';
    const wordsData = typeof WORDS_DATA !== 'undefined' ? WORDS_DATA : [];

    // Kategorileri Dinamik Al
    const cats = ['all'];
    wordsData.forEach(w => {
      if (w.category && !cats.includes(w.category)) cats.push(w.category);
    });

    catContainer.innerHTML = cats.map(c => `
      <button class="cat-btn ${c === 'all' ? 'active' : ''}" data-cat="${c}">
        ${c === 'all' ? 'Tümü (100)' : c}
      </button>
    `).join('');

    function renderCards(list) {
      wordCountBadge.textContent = list.length + ' Kelime';
      if (!list || list.length === 0) {
        wordsGrid.innerHTML = '<div class="no-results"><p>Aradığınız kriterlere uygun kelime bulunamadı.</p></div>';
        return;
      }
      wordsGrid.innerHTML = list.map(item => `
        <div class="word-card">
          <div>
            <div class="word-card-top">
              <span class="word-title">${item.word}</span>
              <span class="word-cat-badge">${item.category || ''}</span>
            </div>
            <div class="word-modern">${item.meaning || item.modern || ''}</div>
            <div class="word-desc">${item.desc || item.description || ''}</div>
          </div>
          ${item.example ? `<div class="word-example">"${item.example}"</div>` : ''}
        </div>
      `).join('');
    }

    function applyFilter() {
      const q = (searchInput.value || '').toLowerCase().trim();
      const filtered = wordsData.filter(w => {
        const matchCat = (activeCat === 'all') || (w.category === activeCat);
        const wTitle = (w.word || '').toLowerCase();
        const wModern = (w.meaning || w.modern || '').toLowerCase();
        const wDesc = (w.desc || w.description || '').toLowerCase();
        const matchSearch = !q || wTitle.includes(q) || wModern.includes(q) || wDesc.includes(q);
        return matchCat && matchSearch;
      });
      renderCards(filtered);
    }

    searchInput.addEventListener('input', applyFilter);

    catContainer.addEventListener('click', e => {
      const btn = e.target.closest('.cat-btn');
      if (!btn) return;
      catContainer.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCat = btn.getAttribute('data-cat');
      applyFilter();
    });

    renderCards(wordsData);
  </script>
</body>
</html>
